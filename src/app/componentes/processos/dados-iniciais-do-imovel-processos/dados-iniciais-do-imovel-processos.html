<form [formGroup]="form">
  <mat-accordion class="sections-accordion" multi>
    <mat-expansion-panel>
      <mat-expansion-panel-header>
        <mat-panel-title>
          <mat-icon>landscape</mat-icon>
          Dados do imóvel
        </mat-panel-title>
        <mat-panel-description>
          Informações básicas e cadastrais do imóvel.
        </mat-panel-description>
      </mat-expansion-panel-header>

      <div formGroupName="dadosImovel">
        <div class="section-title"></div>

        <div class="form-grid">
          <mat-form-field appearance="outline" class="campo-imovel">
            <mat-label>Nome Imóvel</mat-label>
            <input matInput formControlName="nomeImovel" />
          </mat-form-field>

          <!-- ✅ UF dentro de <mat-select> -->
          <mat-form-field appearance="outline">
            <mat-label>UF</mat-label>
            <mat-select formControlName="uf">
              <mat-option *ngFor="let uf of estados()" [value]="uf.sigla">
                {{ uf.sigla }} — {{ uf.nome }}
              </mat-option>
            </mat-select>
          </mat-form-field>

          <!-- ✅ Município dentro de <mat-select> -->
          <mat-form-field appearance="outline">
            <mat-label>Município</mat-label>
            <mat-select
              formControlName="municipio"
              [disabled]="!form.get('dadosImovel.uf')?.value"
            >
              <mat-option *ngFor="let m of municipios()" [value]="m.nome">
                {{ m.nome }}
              </mat-option>
            </mat-select>
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>Código SNCR</mat-label>
            <input matInput formControlName="codigoSncr" />
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>Matrícula(s)</mat-label>
            <input matInput formControlName="matricula" />
          </mat-form-field>

          <mat-form-field appearance="outline" class="campo-proprietario">
            <mat-label>Nome Proprietário</mat-label>
            <input matInput formControlName="nomeProprietario" />
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>CPF/CNPJ Proprietário</mat-label>
            <input matInput formControlName="cpfCnpjProprietario" />
          </mat-form-field>
        </div>
      </div>
    </mat-expansion-panel>
  </mat-accordion>
</form>
