<div class="principal">
  <h2 mat-dialog-title>Espelho do Imóvel - Detalhes Completos</h2>

  <div class="cabecalho-acoes">
    <div class="data-emissao">
      Emitido em: {{ dataEmissao | date: "dd/MM/yyyy HH:mm" : "" : "pt-BR" }}
    </div>
  </div>

  <mat-dialog-content class="dialog-content-custom">
    <h2 class="section-title">Dados do Imóvel</h2>

    <!-- ===================== DADOS GERAIS ===================== -->
    <div class="dados-grid">
      <label class="campo">
        <span>Nome Imóvel</span>
        <input type="text" readonly [value]="imovel.imovel.imovel || ''" />
      </label>

      <label class="campo">
        <span>UF</span>
        <input
          type="text"
          readonly
          maxlength="2"
          [value]="imovel.imovel.uf || ''"
        />
      </label>

      <label class="campo">
        <span>Município</span>
        <input type="text" readonly [value]="imovel.imovel.municipio || ''" />
      </label>

      <label class="campo">
        <span>Código SNCR</span>
        <input type="text" readonly [value]="imovel.imovel.sncr || ''" />
      </label>

      <label class="campo">
        <span>Matrícula(s)</span>
        <input
          type="text"
          readonly
          [value]="imovel.imovel.matriculas || imovel.imovel.matricula || ''"
        />
      </label>

      <label class="campo" *ngFor="let doc of cpfsFormatados; let i = index">
        <span>
          {{ doc.label }} Partes envolvidas
          {{ cpfsFormatados.length > 1 ? " " + (i + 1) : "" }}
          <!-- {{ doc.nome }} -->
        </span>
        <input type="text" readonly [value]="doc.valor" />
      </label>
      <label class="campo">
        <span>Nome Proprietário</span>
        <input
          type="text"
          readonly
          [value]="imovel.imovel.proprietario || ''"
        />
      </label>

      <label class="campo">
        <span>CPF/CNPJ Proprietário</span>
        <input
          type="text"
          readonly
          [value]="
            imovel.imovel.cpfCnpjProprietario || imovel.imovel.cpfCnpj || ''
          "
        />
      </label>
    </div>

    <!-- ===================== ÁREAS (ha) ===================== -->
    <h4 class="bloco-titulo">Áreas (ha)</h4>
    <div class="dados-grid">
      <label class="campo">
        <span>Registrada (matrícula)</span>
        <input
          type="number"
          step="0.0001"
          readonly
          [value]="imovel.imovel.areaRegistrada ?? ''"
        />
        <small>ha</small>
      </label>

      <label class="campo">
        <span>Medida</span>
        <input
          type="number"
          step="0.0001"
          readonly
          [value]="imovel.imovel.areaCertificada ?? imovel.imovel.areaHa ?? ''"
        />
        <small>ha</small>
      </label>

      <label class="campo">
        <span>Avaliada</span>
        <input
          type="number"
          step="0.0001"
          readonly
          [value]="imovel.imovel.areaAvaliada ?? ''"
        />
        <small>ha</small>
      </label>

      <label class="campo">
        <span>Visada</span>
        <input
          type="number"
          step="0.0001"
          readonly
          [value]="imovel.imovel.areaVisada ?? ''"
        />
        <small>ha</small>
      </label>
    </div>

    <!-- ===================== VALORES (R$) ===================== -->
    <h4 class="bloco-titulo">Valores (R$)</h4>
    <div class="dados-grid">
      <label class="campo">
        <span>Total do Imóvel Inferior</span>
        <input
          type="number"
          step="0.01"
          readonly
          [value]="imovel.avaliacao.valorTotalImovelInferior ?? ''"
        />
      </label>

      <label class="campo">
        <span>Total do Imóvel Médio</span>
        <input
          type="number"
          step="0.01"
          readonly
          [value]="imovel.avaliacao.valorTotalImovelMedio ?? ''"
        />
      </label>

      <label class="campo">
        <span>Total do Imóvel Superior</span>
        <input
          type="number"
          step="0.01"
          readonly
          [value]="imovel.avaliacao.valorTotalImovelSuperior ?? ''"
        />
      </label>

      <label class="campo">
        <span>VTI estimado</span>
        <input
          type="number"
          step="0.01"
          readonly
          [value]="
            imovel.avaliacao.valorTotalImovelMedio ??
            imovel.imovel.vtiMedio ??
            ''
          "
        />
      </label>

      <label class="campo">
        <span>Terra Nua Inferior</span>
        <input
          type="number"
          step="0.01"
          readonly
          [value]="imovel.avaliacao.valorTerraNuaInferior ?? ''"
        />
      </label>

      <label class="campo">
        <span>Terra Nua Médio</span>
        <input
          type="number"
          step="0.01"
          readonly
          [value]="imovel.avaliacao.valorTerraNuaMedio ?? ''"
        />
      </label>

      <label class="campo">
        <span>Terra Nua Superior</span>
        <input
          type="number"
          step="0.01"
          readonly
          [value]="imovel.avaliacao.valorTerraNuaSuperior ?? ''"
        />
      </label>

      <label class="campo">
        <span>VTN estimado</span>
        <input
          type="number"
          step="0.01"
          readonly
          [value]="
            imovel.avaliacao.valorTerraNuaMedio ?? imovel.imovel.vtnMedio ?? ''
          "
        />
      </label>

      <label class="campo">
        <span>Benfeitorias</span>
        <input
          type="number"
          step="0.01"
          readonly
          [value]="imovel.avaliacao.valorBenfeitorias ?? ''"
        />
      </label>

      <label class="campo">
        <span>Passivo Ambiental</span>
        <input
          type="number"
          step="0.01"
          readonly
          [value]="imovel.avaliacao.valorPassivoAmbiental ?? ''"
        />
      </label>

      <label class="campo">
        <span>Ativo Ambiental</span>
        <input
          type="number"
          step="0.01"
          readonly
          [value]="imovel.avaliacao.valorAtivoAmbiental ?? ''"
        />
      </label>
    </div>
  </mat-dialog-content>
  <hr />

  <!-- ===================== NATUREZA OCUPACIONAL ===================== -->
  <h2 class="section-title">Natureza ocupacional</h2>

  <div class="dados-grid">
    <label class="campo">
      <span>Entidade Demandante</span>
      <input
        type="text"
        readonly
        [value]="imovel.obtencao.entidadeDemandante || ''"
      />
    </label>

    <label class="campo">
      <span>Acampamento Vinculado</span>
      <input
        type="text"
        readonly
        [value]="imovel.obtencao.acampamentoVinculado || ''"
      />
    </label>

    <label class="campo">
      <span>Imóvel atualmente ocupado?</span>
      <input
        type="text"
        readonly
        [value]="
          imovel.obtencao.imovelOcupado === true
            ? 'Sim'
            : imovel.obtencao.imovelOcupado === false
              ? 'Não'
              : ''
        "
      />
    </label>

    <label class="campo">
      <span>Ações de Reintegração de Posse</span>
      <input
        type="text"
        readonly
        [value]="imovel.obtencao.acoesReintegracao || ''"
      />
    </label>

    <label class="campo">
      <span>Órgão Concorrente</span>
      <input
        type="text"
        readonly
        [value]="imovel.obtencao.orgaoConcorrente || ''"
      />
    </label>

    <label class="campo">
      <span>Capacidade de Assentamento</span>
      <input
        type="number"
        step="1"
        readonly
        [value]="imovel.obtencao.capacidadeAssentamento ?? ''"
      />
    </label>

    <label class="campo">
      <span>Famílias Cadastradas</span>
      <input
        type="number"
        step="1"
        readonly
        [value]="imovel.obtencao.familiasCadastradas ?? ''"
      />
    </label>
  </div>

  <hr />

  <!-- ============= DADOS DO PROCESSO DE OBTENÇÃO ============= -->
  <h2 class="section-title">Dados do processo de obtenção</h2>

  <div class="dados-grid">
    <label class="campo">
      <span>Processo SEI</span>
      <input type="text" readonly [value]="imovel.obtencao.processoSei || ''" />
    </label>

    <label class="campo">
      <span>Processo Cadeia Dominial</span>
      <input
        type="text"
        readonly
        [value]="imovel.obtencao.processoCadeiaDominial || ''"
      />
    </label>

    <label class="campo">
      <span>Fase atual do processo</span>
      <input
        type="text"
        readonly
        [value]="
          imovel.obtencao.faseAtualProcesso || imovel.imovel.situacao || ''
        "
      />
    </label>
  </div>

  <mat-dialog-actions align="end">
    <button mat-flat-button color="primary" (click)="window.print()">
      <mat-icon>print</mat-icon>
      Imprimir
    </button>

    <button
      mat-stroked-button
      color="primary"
      mat-dialog-close
      (click)="fechar()"
    >
      <mat-icon>close</mat-icon>
      Fechar
    </button>
  </mat-dialog-actions>
</div>
